<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<!--    <script src="https://cdn.tailwindcss.com"></script>-->
    <title>List Users</title>
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <!-- Header Section -->
    <div class="row p-4">
        <div class="col-md-6">
            <h5>List Users</h5>
        </div>
        <div class="col-md-6">
            <a class="btn btn-primary btn-sm float-right text-white font-weight-bold" th:href="@{/admin/users/add}">Add New User</a>
        </div>
    </div>

    <!-- Users Table -->
    <div class="row">
        <table class="table table-ordered table-hover">
            <thead>
            <tr>
                <th>Id</th>
                <th>Username</th>
                <th>Email</th>
                <th>PhoneNumber</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.getId()}"></td>
                <td th:text="${user.getUsername()}"></td>
                <td th:text="${user.getEmail()}"></td>
                <td th:text="${user.getPhoneNumber()}"></td>
                <td th:text="${user.getStatus()}"></td>
                <td>
                    <a class="btn btn-primary btn-sm text-white font-weight-bold">View</a>
                    <a class="btn btn-warning btn-sm text-white font-weight-bold">Edit</a>
                    <a class="btn btn-danger btn-sm text-white font-weight-bold">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossOrigin="anonymous">
</script>
</html>
