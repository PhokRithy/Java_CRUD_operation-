<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<!--    <script src="https://cdn.tailwindcss.com"></script>-->
    <title>Form Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">-->
</head>
<body>
<div class="container">
    <div class="row p-4">
        <div class="col-md-6">
            <h5>Form Users</h5>
        </div>
        <div class="col-md-6">
            <a class="btn btn-primary btn-sm float-right text-white font-weight-bold " th:href="@{/admin/users}">Back to List</a>
        </div>
    </div>
    <div class="row">
        <form th:action="@{/admin/users/create}" method="post" th:object="${user}" class="w-100">
            <input type="text" hidden th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="phone number" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                        type="password"
                        class="form-control"
                        th:field="*{password}"
                        placeholder="password"
                        required
                        pattern="\d{4,}"
                        title="Password must be at least 4 digits long">
            </div>
            <div class="mb-3">
                <button class="btn btn-primary btn-sm font-weight-bold p-2">Create</button>
            </div>
        </form>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossOrigin="anonymous">

</script>
</html>
